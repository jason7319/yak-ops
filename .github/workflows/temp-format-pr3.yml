name: Temporary PR3 Spotless Format

on:
  push:
    branches:
      - feature/v1.3-multi-table-runtime-retry-metrics
    paths:
      - .github/workflows/temp-format-pr3.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'weifuwan/yak-ops' && github.ref == 'refs/heads/feature/v1.3-multi-table-runtime-retry-metrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply project Spotless formatting
        run: >-
          bash mvnw -q -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit formatting to PR3 head only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.java'
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply repository spotless to PR3'
            git push origin HEAD:feature/v1.3-multi-table-runtime-retry-metrics
          fi
